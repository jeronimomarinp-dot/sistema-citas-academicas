<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Bot</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
    <link
        rel="stylesheet"
        href="../assets/css/global.css"
    >
    <link
        rel="stylesheet"
        href="../assets/css/chatbot.css"
    >

</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <!-- SIDEBAR -->

            <div class="col-md-2 sidebar">

                <h3>Estudiante</h3>

                <a href="./dashboard.estudiante.html">
                    <i class="bi bi-house"></i>
                    Inicio
                </a>

                <a href="./agendar-citas.html">
                    <i class="bi bi-calendar-check"></i>
                    Agendar Cita
                </a>

                <a href="./mis-citas.html">
                    <i class="bi bi-list-check"></i>
                    Mis Citas
                </a>

                <a href="./materiales-estudiante.html">
                    <i class="bi bi-file-earmark-text"></i>
                    Materiales Académicos
                </a>

                <a href="#">
                    <i class="bi bi-file-earmark-text"></i>
                    Documentos
                </a>

                <a href="./chatbot.html" class="active">
                    <i class="bi bi-chat-dots"></i>
                    Chat Bot
                </a>

                <a href="./login.html" id="logout">
                    <i class="bi bi-box-arrow-right"></i>
                    Cerrar sesión
                </a>

            </div>


            <!-- CONTENIDO -->

            <div class="col-md-10 p-4">

                <h2 class="mb-4">

                    <i class="bi bi-chat-dots"></i>

                    Asistente Académico

                </h2>


                <div class="card chatbot-card">

                    <div class="card-header">

                        <h5 class="mb-0">

                            Chat Bot

                        </h5>

                    </div>


                    <div class="card-body">

                        <div id="chat" class="chat-container">

                            <div class="text-muted">

                                Hola, soy tu asistente académico.
                                ¿En qué puedo ayudarte?

                            </div>

                        </div>


                        <form id="chatbotForm">

                            <div class="input-group">

                                <input
                                    type="text"
                                    id="pregunta"
                                    class="form-control"
                                    placeholder="Escribe tu pregunta..."
                                    autocomplete="off"
                                    required
                                >

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >

                                    <i class="bi bi-send"></i>

                                    Enviar

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/chatbot.js"></script>

    <script>
        validarRol(['estudiante']);
    </script>

</body>

</html>

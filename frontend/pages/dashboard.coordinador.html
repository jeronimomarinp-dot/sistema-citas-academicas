<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Coordinador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/global.css">

    <link rel="stylesheet" href="../assets/css/dashboard.coordinador.css">

</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->

            <div class="col-md-2 sidebar">

                <h3>Coordinador</h3>

                <a href="#">
                    <i class="bi bi-house"></i>
                    Inicio
                </a>

                <a href="./ver-citas.html">
                    <i class="bi bi-calendar-event"></i>
                    Gestionar Citas
                </a>

                <a href="./disponibilidad.html">
                    <i class="bi bi-clock-history"></i>
                    Disponibilidad
                </a>

                <a href="#">
                    <i class="bi bi-file-earmark-arrow-up"></i>
                    Subir Documentos
                </a>

                <a href="#">
                    <i class="bi bi-chat-square-text"></i>
                    Configurar Bot
                </a>

                <a href="#" id="logout">
                    <i class="bi bi-box-arrow-right"></i>
                    Cerrar sesión
                </a>

            </div>

            <!-- Contenido -->

            <div class="col-md-10 p-4">

                <h2 class="mb-4">
                    Bienvenido Coordinador
                </h2>

                <div class="row">

                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Total Citas</h5>

                            <h2 id="total">0</h2>

                        </div>

                    </div>

                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Citas Pendientes</h5>

                            <h2 id="pendientes">0</h2>

                        </div>

                    </div>

                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Citas Aceptadas</h5>

                            <h2 id="aceptadas">0</h2>

                        </div>

                    </div>

                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Citas Rechazadas</h5>

                            <h2 id="rechazadas">0</h2>

                        </div>

                    </div>

                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Documentos Subidos</h5>

                            <h2>20</h2>

                        </div>

                    </div>

                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Preguntas Bot</h5>

                            <h2>15</h2>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/dashboard.coordinador.js"></script>
    <script>
        validarRol(['coordinador']);
    </script>


</body>

</html>

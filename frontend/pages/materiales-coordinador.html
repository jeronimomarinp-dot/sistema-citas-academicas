<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Materiales Académicos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>

                        <h2>
                            Materiales Académicos
                        </h2>

                        <p class="text-muted mb-0">
                            Administra los materiales de tu materia.
                        </p>

                    </div>

                    <a href="./dashboard.coordinador.html" class="btn btn-secondary">
                        Volver
                    </a>

                </div>


                <!-- FORMULARIO -->

                <div class="card mb-4">

                    <div class="card-body">

                        <h5 class="mb-3">
                            Subir nuevo material
                        </h5>

                        <form id="formMaterial">

                            <div class="mb-3">

                                <label for="titulo" class="form-label">
                                    Título
                                </label>

                                <input type="text" class="form-control" id="titulo" required>

                            </div>


                            <div class="mb-3">

                                <label for="descripcion" class="form-label">
                                    Descripción
                                </label>

                                <textarea class="form-control" id="descripcion" rows="3"></textarea>

                            </div>


                            <div class="mb-3">

                                <label for="archivo" class="form-label">
                                    Archivo
                                </label>

                                <input type="file" class="form-control" id="archivo" required>

                                <small class="text-muted">
                                    Formatos permitidos: PDF, Word y Excel.
                                </small>

                            </div>


                            <button type="submit" class="btn btn-primary">
                                Subir material
                            </button>

                        </form>

                    </div>

                </div>


                <!-- TABLA -->

                <h5 class="mb-3">
                    Mis materiales
                </h5>

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th>
                                    Material
                                </th>

                                <th>
                                    Descripción
                                </th>

                                <th>
                                    Tipo
                                </th>

                                <th>
                                    Estado
                                </th>

                                <th>
                                    Acción
                                </th>

                            </tr>

                        </thead>

                        <tbody id="tablaMateriales">

                            <tr>

                                <td colspan="5" class="text-center">
                                    Cargando materiales...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/materiales-coordinador.js"></script>

    <script>

        validarRol(['coordinador']);

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Áreas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow p-4">

            <div class="d-flex justify-content-between mb-4">

                <h2>Gestión de Áreas</h2>

                <a href="./dashboard.admin.html" class="btn btn-secondary">
                    Volver
                </a>

            </div>

            <form id="formArea" class="mb-4">

                <div class="row">

                    <div class="col-md-10">

                        <input type="text" id="nombreArea" class="form-control" placeholder="Nombre del área" required>

                    </div>

                    <div class="col-md-2">

                        <button type="submit" class="btn btn-primary w-100">
                            Crear
                        </button>

                    </div>

                </div>

            </form>

            <table class="table table-bordered">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Acción</th>

                    </tr>

                </thead>

                <tbody id="tablaAreas">

                </tbody>

            </table>

        </div>

    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/areas.js"></script>
    <script>
        validarRol(['admin']);
    </script>
</body>

</html>

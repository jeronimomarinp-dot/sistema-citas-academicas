<form id="formReset">

    <div class="mb-3">

        <label>Nueva contraseña</label>

        <input
            type="password"
            class="form-control"
            id="password"
            required>

    </div>

    <div class="mb-3">

        <label>Confirmar contraseña</label>

        <input
            type="password"
            class="form-control"
            id="confirmarPassword"
            required>

    </div>

    <button class="btn btn-primary w-100">
        Cambiar contraseña
    </button>

</form>

<script src="../assets/js/reset-password.js"></script>

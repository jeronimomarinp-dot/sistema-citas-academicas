<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Estudiante</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
    <link
        rel="stylesheet"
        href="../assets/css/global.css"
    >
    <link
        rel="stylesheet"
        href="../assets/css/dashboard.estudiante.css"
    >

</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <!-- SIDEBAR -->

            <div class="col-md-2 sidebar">

                <h3>Estudiante</h3>

                <a href="#">
                    <i class="bi bi-house"></i>
                    Inicio
                </a>

                <a href="./agendar-citas.html">
                    <i class="bi bi-calendar-check"></i>
                    Agendar Cita
                </a>

                <a href="./mis-citas.html">
                    <i class="bi bi-list-check"></i>
                    Mis Citas
                </a>

                <a href="./materiales-estudiante.html">
                    <i class="bi bi-file-earmark-text"></i>
                    Materiales Académicos
                </a>

                <a href="#">
                    <i class="bi bi-file-earmark-text"></i>
                    Documentos
                </a>

                <a href="./chatbot.html">
                    <i class="bi bi-chat-dots"></i>
                    Chat Bot
                </a>

                <a href="#" id="logout">
                    <i class="bi bi-box-arrow-right"></i>
                    Cerrar sesión
                </a>

            </div>


            <!-- CONTENIDO -->

            <div class="col-md-10 p-4">

                <h2 class="mb-4">
                    Bienvenido Estudiante
                </h2>


                <!-- ESTADÍSTICAS -->

                <div class="row">

                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Citas Pendientes</h5>

                            <h2 id="pendientes">0</h2>

                        </div>

                    </div>


                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Citas Aceptadas</h5>

                            <h2 id="aceptadas">0</h2>

                        </div>

                    </div>


                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Citas Rechazadas</h5>

                            <h2 id="rechazadas">0</h2>

                        </div>

                    </div>


                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Total Citas</h5>

                            <h2 id="total">0</h2>

                        </div>

                    </div>


                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Área Académica</h5>

                            <h2>Ingeniería</h2>

                        </div>

                    </div>


                    <div class="col-md-4 mb-4">

                        <div class="card card-dashboard p-4">

                            <h5>Documentos Disponibles</h5>

                            <h2>12</h2>

                        </div>

                    </div>

                </div>


                <!-- NOTIFICACIONES -->

                <div class="card mt-4">

                    <div class="card-header">

                        <h5 class="mb-0">

                            <i class="bi bi-bell"></i>

                            Notificaciones

                            <span
                                id="contadorNotificaciones"
                                class="badge bg-danger contador-notificaciones"
                            >
                                0
                            </span>

                        </h5>

                    </div>


                    <div class="card-body">

                        <div id="contenedorNotificaciones">

                            <div class="text-muted">

                                Cargando notificaciones...

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/notificaciones.js"></script>
    <script src="../assets/js/dashboard.estudiante.js"></script>

    <script>
        validarRol(['estudiante']);
        cargarNotificaciones();
    </script>

</body>

</html>

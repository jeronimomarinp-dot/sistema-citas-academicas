<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendar Cita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h2 class="mb-4">
                Agendar Nueva Cita
            </h2>

            <div class="alert alert-info">

                <strong>Antes de agendar tu cita:</strong>

                consulta los materiales académicos disponibles.
                Es posible que encuentres allí la respuesta
                a tu duda.

                <br><br>

                <a href="./materiales-estudiante.html" class="btn btn-outline-primary">
                    Consultar materiales académicos
                </a>

            </div>

            <a href="./dashboard.estudiante.html" class="btn btn-secondary">
                Volver
            </a>

            <form id="formCita">

                <div class="mb-3">

                    <label class="form-label">
                        Coordinador
                    </label>

                    <select class="form-select" id="coordinador" required>

                        <option value="">
                            Seleccione un coordinador
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Fecha
                    </label>

                    <input type="date" class="form-control" id="fecha" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Hora disponible
                    </label>

                    <select class="form-select" id="hora" required>
                        <option value="">
                            Seleccione una hora
                        </option>
                    </select>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Motivo
                    </label>

                    <textarea class="form-control" id="motivo" rows="4" required></textarea>

                </div>

                <button class="btn btn-primary w-100">
                    Agendar Cita
                </button>

            </form>

        </div>

    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/agendar-citas.js"></script>
    <script>
        validarRol(['estudiante']);
    </script>

</body>

</html>
